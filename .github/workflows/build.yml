name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: humanbot-jar
          path: build/libs/*.jar
      # keep the latest built jar in the repo (dist/) so it can be downloaded directly
      - name: Commit built jar
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp build/libs/humanbot-*.jar dist/
          rm -f dist/*-sources.jar dist/*-dev.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || (git commit -m "Add built jar [skip ci]" && git push)
