name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Find the Fabric API build for this Minecraft version
        run: |
          curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml -o meta.xml
          API=$(grep -o "<version>[^<]*+${{ matrix.mc }}</version>" meta.xml | sed 's/<[^>]*>//g' | tail -1)
          echo "Fabric API: $API"
          test -n "$API"
          echo "API=$API" >> "$GITHUB_ENV"
      - run: chmod +x gradlew && ./gradlew build --no-daemon -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=$API -Pminecraft_dep="~${{ matrix.mc }}" -Pcompat_dir=mc${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: humanbot-mc${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
  publish:
    needs: build
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: humanbot-mc*
          merge-multiple: true
      # keep the latest built jars in the repo (dist/) so they can be downloaded directly
      - run: |
          rm -f dist/*.jar
          mkdir -p dist
          cp artifacts/*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dist
          git diff --cached --quiet || (git commit -m "Add built jars [skip ci]" && git push)
